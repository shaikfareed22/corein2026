name: Feature request
description: Something FOMO should do, or should do differently.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Say what problem the change solves and what you would expect to see; a request that
        names a real task you tried to do is the kind most likely to land. If another product
        does it the way you want, a link to where that is described helps.
  - type: textarea
    id: problem
    attributes:
      label: What you are trying to do
      description: "The task or situation, in a sentence or two. Not the solution yet."
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you would like to happen
      description: "How it should look in the app, the CLI or the API. Mock-ups and examples help."
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: What you do today instead
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Phone / web app
        - Agent behaviour and prompts
        - Sentinel, approvals, vault
        - Tools and connections (email, browser, MCP, …)
        - Goals, memory, proactivity
        - Models and providers
        - Docs
        - Other
