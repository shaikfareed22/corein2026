name: Website

# Publishes site/ to GitHub Pages at https://fomo.corein.in/ (site/CNAME), the docs under /docs/.
# Since 0.1.6 the homepage lives in nano-muse/nano-muse.github.io, served at fomo.corein.in; this
# project page is a redirect to it, with the earlier page kept at legacy.html (its generated parts,
# the dragon's five moods, icons, fonts, screenshots, are copied from web/ and docs/ below).
# Since 0.1.38 the docs site (website/, VitePress over docs/) is built into site/docs/ and
# published alongside: https://nano-muse.github.io/corein/docs/. The same build with
# DOCS_BASE=/docs/ is what fomo.corein.in/docs/ serves.

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "docs/**"
      - "website/**"
      - "web/public/avatars/dragon-*.webp"
      - "web/public/icon.svg"
      - "web/public/mark.svg"
      - "docs/screenshots/**"
      - "docs/cover.png"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

# Only the deploy job writes (actions/deploy-pages); the build reads the site's settings
# (actions/configure-pages, a GET) and gets nothing more.
permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pages: write # corein: configure-pages enables the site itself
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Assemble site/assets (the dragon, the icons, the fonts, the screenshots)
        run: |
          mkdir -p site/assets/fonts site/assets/screens
          cp web/public/icon.svg web/public/mark.svg web/public/avatars/dragon-*.webp site/assets/
          cp assets/brand/corein-wordmark.svg assets/brand/corein-wordmark-white.svg assets/brand/corein-logo-dark.png assets/brand/corein-logo.png assets/brand/corein-logo@3x.png assets/brand/corein-mark.svg assets/brand/corein-icon.svg docs/app-icon.png site/assets/ # corein: the landing page's brand files
          cp web/public/fonts/figtree-latin.woff2 web/public/fonts/figtree-latin-ext.woff2 web/public/fonts/OFL.txt site/assets/fonts/
          cp docs/screenshots/*.png site/assets/screens/
          cp docs/cover.png site/assets/cover.png
          cat > site/assets/mascot.js <<'JS'
          // generated by .github/workflows/pages.yml: the dragon, one picture per mood
          window.NANOMUSE_MASCOT = (function () {
            var img = function (m) { return '<img src="assets/dragon-' + m + '.webp" alt="" width="200" height="200">'; };
            return { idle: img("idle"), working: img("working"), waiting: img("waiting"), happy: img("happy"), error: img("error"), sleepy: img("idle") };
          })();
          JS
          echo '.clip img { width: 100%; height: 100%; object-fit: cover; }' > site/assets/mascot.css
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json
      - name: Lock file resolves against the public registry only
        run: |
          if grep -hoE '"resolved": "https?://[^/]+' website/package-lock.json | grep -v 'registry.npmjs.org'; then
            echo "website/package-lock.json resolves packages from a host other than registry.npmjs.org; regenerate it against the public registry" >&2
            exit 1
          fi
      - name: Build the docs site into site/docs/
        working-directory: website
        env:
          DOCS_BASE: /docs/
        run: |
          npm ci
          npm run docs:build
          rm -rf ../site/docs
          mkdir -p ../site/docs
          cp -R .vitepress/dist/. ../site/docs/
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
        with:
          enablement: true # corein: switch Pages on for a fresh fork (source: GitHub Actions)
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
